spring:
  application:
    name: taskhub-api
  flyway:
    enabled: true
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

springdoc:
  paths-to-match: /api/**

taskhub:
  notification:
    grpc:
      enabled: true
      address: notification-service:9090
      plaintext: false
      deadline: PT2S

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
