server:
  port: ${TASKHUB_API_PORT:8080}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

taskhub:
  security:
    jwt-secret: ${TASKHUB_JWT_SECRET:taskhub-development-only-signing-key-32-bytes}
    token-ttl: PT1H
  cors:
    allowed-origins: ${TASKHUB_CORS_ALLOWED_ORIGINS:http://localhost:3000}
