server:
  port: ${TASKHUB_API_PORT:8080}

spring:
  datasource:
    url: ${TASKHUB_DB_URL:jdbc:postgresql://localhost:5432/taskhub}
    username: ${TASKHUB_DB_USERNAME:taskhub}
    password: ${TASKHUB_DB_PASSWORD:taskhub-local}

taskhub:
  notification:
    grpc:
      address: localhost:9090
      plaintext: true
  security:
    jwt-secret: ${TASKHUB_JWT_SECRET:taskhub-development-only-signing-key-32-bytes}
    token-ttl: PT1H
  cors:
    allowed-origins: ${TASKHUB_CORS_ALLOWED_ORIGINS:http://localhost:3000}
