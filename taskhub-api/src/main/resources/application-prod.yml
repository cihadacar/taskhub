server:
  port: ${TASKHUB_API_PORT:8080}

spring:
  datasource:
    url: ${TASKHUB_DB_URL}
    username: ${TASKHUB_DB_USERNAME}
    password: ${TASKHUB_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

taskhub:
  security:
    jwt-secret: ${TASKHUB_JWT_SECRET}
    token-ttl: ${TASKHUB_JWT_TTL:PT1H}
  cors:
    allowed-origins: ${TASKHUB_CORS_ALLOWED_ORIGINS}
